# Named home poses, one section per robot model.
#
# Each entry becomes a `home_position/<name>` Trigger service; calling it makes
# the solver interpolate there collision-safely and publish /opensot/home_done.
# Add a pose by adding a block: arm_left / arm_right are 7 values, head 2, torso 1.
# (Only these four keys are used; the base pose is fixed.)

